name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check tailwind.css is up to date
        run: |
          npm run build:css
          git diff --exit-code tailwind.css || (echo "::error::tailwind.css is stale. Run 'npm run build:css' and commit it." && exit 1)
